[package]
name = "chronos-ui-app"
version = "0.1.0"
description = "ChronosRecover Desktop Frontend"
authors = ["ChronosRecover Team"]
license = "Proprietary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
