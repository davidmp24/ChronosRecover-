[workspace]
members = [
    "chronos-proto",
    "chronos-engine",
    "chronos-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ChronosRecover Team"]
license = "Proprietary"
repository = "https://github.com/chronos-recover/chronos"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
thiserror = "1.0"
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "backup", "blob"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
crossbeam-channel = "0.5"
rayon = "1.10"
aho-corasick = "1.1"
crc32fast = "1.4"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Windows HAL dependencies
[target.'cfg(windows)'.workspace.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
] }

# Linux HAL dependencies
[target.'cfg(unix)'.workspace.dependencies]
nix = { version = "0.29", features = ["fs", "ioctl", "poll"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true
